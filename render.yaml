# Blueprint de Render para el entorno de DESARROLLO.
# En Render: New → Blueprint → elige este repo. Te pedirá los valores marcados con sync: false.
services:
  - type: web
    name: provision-backend-dev
    runtime: node
    plan: free
    # Debe ser la MISMA región de tu base de datos en Render; si no, la Internal Database URL no conecta.
    region: virginia
    branch: main
    buildCommand: npm ci && npm run build
    # Al arrancar aplica las migraciones pendientes
    startCommand: node dist/index.js
    healthCheckPath: /salud
    envVars:
      - key: APP_ENV
        value: desarrollo
      - key: NODE_VERSION
        value: "22"
      # Pega aquí la "Internal Database URL" de tu base en Render
      - key: DATABASE_URL
        sync: false
      # La conexión interna de Render no usa SSL
      - key: DATABASE_SSL
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # URL del frontend de desarrollo (varias separadas por coma)
      - key: CORS_ORIGIN
        sync: false
      - key: LOG_HTTP
        value: "true"
      # Tienda web: dirección del frontend (Stripe vuelve aquí después de pagar)
      - key: TIENDA_URL
        sync: false
      # Stripe (modo de prueba: sk_test_… y whsec_…). Vacíos = solo pago al retirar.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Fotos de productos: cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      - key: CLOUDINARY_URL
        sync: false
      # Correos a clientes (re_…). Con dominio verificado, define también CORREO_REMITENTE.
      - key: RESEND_API_KEY
        sync: false
